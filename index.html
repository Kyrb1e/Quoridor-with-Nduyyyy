<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#221a12;--fg:#f6f1e7;--mut:color-mix(in srgb,var(--fg) 68%,transparent);--acc:#d6b98a;--ink:#15110c;
--body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'MedievalSharp',Georgia,serif;--dw:400;--rad:12px;
--panel:#ffffff10;--line:#ffffff26;--fr1:#5a4630;--fr2:#2f2216;--frb:#9a7c4c;--frg:0 0 0 0 transparent;--wl:#7a5533;--wl2:#4a3320;--we:#e0c9a0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body)}
#bg{position:fixed;inset:0;z-index:-1;background:var(--bg)}
#bg>div{position:absolute;inset:0;animation:bgin .5s both}
@keyframes bgin{from{opacity:0}}
main{max-width:960px;margin:0 auto;padding:22px 16px 28px}
h1,h2,#wt,#tn{font-family:var(--disp);font-weight:var(--dw);letter-spacing:.01em}

/* tombol dasar */
button{font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);border-radius:calc(var(--rad) - 2px);padding:10px 14px;transition:background .2s,border-color .2s,transform .12s,box-shadow .2s}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg button:hover,.tool button:hover,.ghost:hover,#win button:hover{background:#ffffff1f}
button.on,.seg button.on:hover,.tool button.on:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 24%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* menu */
#menu{max-width:940px;margin:0 auto}
h1{display:flex;align-items:center;gap:.35em;margin:0;font-size:clamp(2.4rem,9vw,3.5rem);line-height:1.05}
.mark{display:grid;place-items:center;width:1.45em;height:1.45em;flex:none;font-size:.62em;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc) 50%,#fff),var(--acc) 62%,color-mix(in srgb,var(--acc) 60%,#000));box-shadow:0 6px 16px -6px var(--acc),inset 0 0 0 3px #0000002e}
.tagline{margin:.2em 0 0;color:var(--mut)}
.mgrid{display:grid;gap:20px;margin-top:20px}
@media(min-width:860px){.mgrid{grid-template-columns:minmax(300px,390px) 1fr;gap:38px;align-items:start}.pvcol{position:sticky;top:20px}}
.pvcol{width:100%;max-width:430px;margin:0 auto}
.pvcap{margin-top:14px;text-align:center}
#tn{display:block;font-size:1.3rem;color:var(--acc)}
#tt{color:var(--mut);font-size:.93rem}
.rules{margin:0;color:var(--mut);max-width:54ch}
h2{margin:1.5em 0 .5em;font-size:1.15rem;color:var(--acc)}
.rules+h2{margin-top:1.2em}
.note{margin:-.35em 0 .75em;color:var(--mut);font-size:.9rem}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border:2px solid #ffffff1c;border-radius:calc(var(--rad) + 2px);
 background:linear-gradient(165deg,color-mix(in srgb,var(--ta) 26%,var(--t1)),var(--t1) 72%);color:#f6f1e7;font-size:.8rem;line-height:1.15;text-align:center}
.tc:hover{filter:brightness(1.14)}
.tc .ic2{font-size:1.75rem;line-height:1}
.tc .dots{display:flex;gap:4px}
.tc .dots u{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #0007;text-decoration:none}
.tc.on{background:linear-gradient(165deg,color-mix(in srgb,var(--ta) 26%,var(--t1)),var(--t1) 72%);border-color:var(--ta);box-shadow:0 0 0 3px color-mix(in srgb,var(--ta) 30%,transparent),0 10px 22px -10px var(--ta)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto}
#modes button{flex:1 1 150px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.25}
#modes small{color:var(--mut);font-size:.8rem}
#lvs button{min-width:78px}
.lvd{margin:.65em 0 0;color:var(--mut);font-size:.93rem;min-height:2.9em}
.lvd b{color:var(--fg)}
.startbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;margin-top:24px;pointer-events:none}
#go{pointer-events:auto;width:min(100%,440px);padding:15px 22px;border:0;border-radius:var(--rad);font-family:var(--disp);font-weight:var(--dw);font-size:1.3rem;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 76%,#fff),var(--acc));color:var(--ink);
 box-shadow:0 14px 30px -10px var(--acc),0 4px 0 color-mix(in srgb,var(--acc) 55%,#000),inset 0 1px 0 #fff9}
#go:active{transform:translateY(3px);box-shadow:0 8px 18px -8px var(--acc),0 1px 0 color-mix(in srgb,var(--acc) 55%,#000),inset 0 1px 0 #fff9}

/* bingkai papan: ikut tema */
.wrap{position:relative;max-width:640px;margin:0 auto;padding:clamp(8px,2.6vw,15px);border-radius:var(--rad);
 background:linear-gradient(145deg,var(--fr1),var(--fr2));border:2px solid var(--frb);
 box-shadow:var(--frg),0 22px 44px -18px #000d,inset 0 1px 0 #ffffff30,inset 0 0 0 1px #0006}
.wrap::before{content:'';position:absolute;inset:4px;border-radius:calc(var(--rad) - 3px);border:1px solid color-mix(in srgb,var(--frb) 55%,transparent);pointer-events:none}
.in{position:relative;border-radius:max(3px,calc(var(--rad) - 8px));overflow:hidden;box-shadow:0 0 0 2px #000a}
.in::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 26px #000b;border-radius:inherit}
canvas{display:block;width:100%;aspect-ratio:1;touch-action:manipulation}

/* layar permainan */
#game{display:none;max-width:640px;margin:0 auto}
#top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ghost{padding:7px 13px;font-size:.92rem;background:transparent}
#gt{color:var(--mut);font-size:.92rem}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pc{position:relative;padding:10px 12px 11px;border-radius:var(--rad);border:1.5px solid var(--line);background:var(--panel);transition:border-color .25s,box-shadow .25s,background .25s,transform .25s}
.pc.act{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,#ffffff08);box-shadow:0 0 0 1px var(--pc),0 12px 26px -12px var(--pc);transform:translateY(-2px)}
.pc.act::after{content:'Giliran';position:absolute;top:-11px;right:12px;padding:1px 10px;border-radius:999px;font-size:.72rem;font-weight:800;background:var(--pc);color:var(--pci)}
.ph{display:flex;align-items:center;gap:10px;min-width:0}
.pi{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{color:var(--mut);font-size:.76rem}
.ph em{margin-left:auto;font-style:normal;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;line-height:1.1}
.ch{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:20px;border-radius:50%;
 background:linear-gradient(var(--rim),color-mix(in srgb,var(--rim) 45%,#000));box-shadow:0 3px 8px -2px #000a}
.ch::before{content:'';position:absolute;inset:4px;border-radius:inherit;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 58%,#fff),var(--pc) 58%,color-mix(in srgb,var(--pc) 62%,#000))}
.ch span{position:relative;filter:drop-shadow(0 1px 1px #0006)}
body[data-sh=hex] .ch,body[data-sh=hex] .ch::before{border-radius:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
body[data-sh=diamond] .ch,body[data-sh=diamond] .ch::before{border-radius:0;clip-path:polygon(50% 0,94% 50%,50% 100%,6% 50%)}
body[data-sh=shield] .ch,body[data-sh=shield] .ch::before{border-radius:0;clip-path:polygon(0 8%,50% 0,100% 8%,100% 55%,50% 100%,0 55%)}
.bar{display:flex;gap:3px;margin-top:10px}
.bar i{flex:1;height:15px;border-radius:3px;background:linear-gradient(var(--wl),var(--wl2));box-shadow:inset 0 0 0 1.5px var(--we),0 1px 2px #0008;transition:opacity .3s,transform .3s}
.bar i.u{opacity:.14;transform:scaleY(.55)}
#msg{min-height:2.7em;margin:12px 0 0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:.93rem}
#msg.warn{color:#ffb8a8}
.tool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;font-size:.84rem;line-height:1.15}
.ic{display:grid;place-items:center;width:24px;height:24px}
.ic::before{content:'';display:block;background:currentColor}
.ic.p::before{width:15px;height:15px;border-radius:50%}
.ic.h::before{width:24px;height:6px;border-radius:2px}
.ic.v::before{width:6px;height:24px;border-radius:2px}

/* layar menang / kalah */
#win{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;
 background:radial-gradient(#0000 25%,#000000c4);text-align:center}
#win button{background:#000000b0;backdrop-filter:blur(4px)}
#wt{font-size:clamp(1.9rem,8vw,2.9rem);line-height:1.1}
#ws{font-size:1rem;opacity:.92}
#win .row{animation:fade 1s 1s both}
#win.won #wt{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,shine 2s linear infinite;background:linear-gradient(90deg,#ffe27a,#fff,#ffb300,#fff,#ffe27a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ffb300)}
#win.lose #wt{color:#ff3a3a;text-shadow:0 0 24px #a00;animation:slam .7s both,tremble .12s infinite .7s}
@keyframes pop{from{transform:scale(4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes slam{from{transform:scale(5);opacity:0;filter:blur(12px)}60%{transform:scale(.92)}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:300% 0}}
@keyframes tremble{50%{transform:translate(2px,-2px)}}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){#win *,#bg>div{animation:none!important}*{transition-duration:.01ms!important}}

<main>

   <p class="note">Papan, dinding, dan bidak ikut berganti sesuai tema.</p>

  </div>
 </div>

</section>
<section id="game">

 <div id="hud"></div>
 <div class="wrap"><div class="in"><canvas id="cv" width="840" height="840" aria-label="Papan Quoridor"></canvas>
  <div id="win"><div id="wt"></div><div id="ws"></div><div class="row"><button id="again">Main lagi</button><button id="tomenu">Menu</button></div></div></div></div>
 <div id="msg" role="status" aria-live="polite"></div>
 <div class="tool" role="group" aria-label="Pilih aksi giliranmu">

  <button id="bh"><span class="ic h"></span>Dinding datar</button>
  <button id="bv"><span class="ic v"></span>Dinding tegak</button>
 </div>
</section>
</main>

 }
 pts=pts.filter(q=>now-q.t0<q.l);
 g.textAlign='center';g.textBaseline='middle';
 for(const q of pts){const a=now-q.t0;if(a<0)continue;const t=a/1000;
  g.font=`${u*.2*(q.z||1)}px serif`;g.globalAlpha=1-a/q.l;g.fillStyle=q.c;g.fillText(q.g,(q.x+q.vx*t)*u,(q.y+q.vy*t+.5*(q.gy||0)*t*t)*u);}
 g.globalAlpha=1;g.restore();
}

/* pratinjau di menu: papan demo dengan tema terpilih */
const DEMO={p:[[6,4],[2,4]],h:Array(64).fill(0),v:Array(64).fill(0),w:[7,8],t:0};
DEMO.h[3*8+3]=1;DEMO.v[4*8+5]=1;DEMO.h[5*8+1]=1;DEMO.v[1*8+2]=1;
function drawPreview(){
 const T=TH[theme],g=pctx,W=pv.width,u=W/(9+8*G),now=performance.now();
 g.fillStyle=T.gap;g.fillRect(0,0,W,W);g.drawImage(board(T,theme,W),0,0);
 liveFX(g,T,W,u,now);
 drawWalls(g,u,T,DEMO,now,null);
 for(let i=0;i<2;i++){
  const x=(DEMO.p[i][1]*st+.5)*u,y=(DEMO.p[i][0]*st+.5)*u,bob=Math.sin(now/280+i*2)*u*.03;
  if(i==0){g.save();g.strokeStyle=T.acc;g.lineWidth=3*W/600;g.globalAlpha=.6+.3*Math.sin(now/200);g.beginPath();g.arc(x,y+bob,u*(.5+.03*Math.sin(now/200)),0,TAU);g.stroke();g.restore();}
  drawPawn(g,u,T,i,x,y,{dy:bob,rot:Math.sin(now/500+i)*.05});
 }
}

/* ---------- HUD ---------- */
const pname=i=>mode=='ai'?(i==0?'Kamu':'AI '+LV[lv-1][0]):'Pemain '+(i+1);
function mkHud(){
 $('hud').innerHTML=[0,1].map(i=>`<div class="pc" id="c${i}"><div class="ph"><span class="ch" id="ch${i}"></span><div class="pi"><b id="pn${i}"></b><small>${i?'Menuju sisi bawah':'Menuju sisi atas'}</small></div><em id="pw${i}"></em></div><div class="bar">${'<i></i>'.repeat(10)}</div></div>`).join('');
}
function hintText(){
 if(over||busy||(mode=='ai'&&S.t==1))return'';
 const who=mode=='pp'?`Giliran ${pname(S.t)}. `:'';
 return who+(um=='m'?'Ketuk petak bertitik untuk menggeser bidak.':'Ketuk celah di antara petak untuk memasang dinding.');
}
function say(t,warn){note=t;$('msg').className=warn?'warn':'';showMsg();}
function showMsg(){$('msg').textContent=note||hintText();}
function hud(){
 const T=TH[theme];
 [0,1].forEach(i=>{
  const c=$('c'+i);c.style.setProperty('--pc',T.p[i]);c.style.setProperty('--pci',ink(T.p[i]));c.style.setProperty('--rim',T.rp?shade(T.p[i],.5):T.we);
  c.className='pc'+(!over&&S.t==i?' act':'');
  $('ch'+i).innerHTML=`<span>${T.e[i]}</span>`;$('pn'+i).textContent=pname(i);$('pw'+i).innerHTML=`${S.w[i]}<br><small style="font-weight:600;color:var(--mut);font-size:.7rem">dinding</small>`;
  [...c.querySelectorAll('.bar i')].forEach((e,j)=>e.className=j<S.w[i]?'':'u');
 });
 for(const [id,k] of [['bm','m'],['bh','h'],['bv','v']])$(id).className=um==k?'on':'';
 showMsg();
}

/* ---------- tema: satu pilihan mengubah seluruh tampilan ---------- */
function setBg(css){
 const el=$('bg'),d=document.createElement('div');d.style.background=css;el.append(d);
 setTimeout(()=>{while(el.children.length>1)el.firstChild.remove();},650);
}
function applyTheme(){
 const T=TH[theme],b=document.body,set=(k,v)=>b.style.setProperty(k,v);
 set('--bg',T.bg);set('--acc',T.acc);set('--ink',ink(T.acc));set('--disp',T.fnt);set('--dw',T.fw);set('--rad',T.rad+'px');
 set('--fr1',T.fr[0]);set('--fr2',T.fr[1]);set('--frb',T.fr[2]);set('--wl',T.wall);set('--wl2',shade(T.wall,-.35));set('--we',T.we);
 set('--frg',T.glow?`0 0 28px -4px ${al(T.acc,.5)}`:'0 0 0 0 transparent');
 b.dataset.sh=T.shp;
 setBg(T.pg);
 document.querySelectorAll('#themes button').forEach((e,i)=>{e.classList.toggle('on',i==theme);e.setAttribute('aria-pressed',i==theme);});
 $('mark').textContent=T.i;$('tn').textContent=T.n;$('tt').textContent=T.tag;$('gt').textContent=T.i+' '+T.n;
 if(S&&$('game').style.display=='block')hud();
}

/* ---------- alur permainan ---------- */
function act(m){
 const pl=S.t,now=performance.now(),g=gid;busy=true;let dur;hc=null;
 if(m.t=='m'){
  const f=S.p[pl];ap(S,pl,m);
  const n=Math.abs(m.r-f[0])+Math.abs(m.c-f[1]);
  an[pl]={f,t:[m.r,m.c],t0:now,d:n>1?560:340,j:n>1};dur=an[pl].d;
 }else{ap(S,pl,m);wa[m.t+(m.r*8+m.c)]=now;shake=now+200*K;burst(m);dur=450;}
 say('');hud();
 setTimeout(()=>{
  if(g!=gid)return;
  an[pl]=null;
  if(m.t=='m'&&m.r==(pl==0?0:8)){finish(pl,g);return;}
  S.t=1-pl;hud();
  if(mode=='ai'&&S.t==1){
   busy=true;say('AI sedang berpikir…');
   setTimeout(()=>{if(g!=gid)return;act(aiMove(S,1,lv));},500*K);
  }else{busy=false;showMsg();}
 },dur*K+30);
}
function finish(pl,g){
 over=true;busy=false;say('');hud();
 const lose=mode=='ai'&&pl==1,now=performance.now(),w=$('win');
 endT=now;endW=pl;loser=1-pl;endLose=lose;shake=now;shd=lose?800*K:450*K;cracks=[];
 if(lose){const [r,c]=S.p[0];for(let k=0;k<6;k++){let a=Math.random()*6.283,x=c*st+.5,y=r*st+.5;const q=[[x,y]];
  for(let n=0;n<9;n++){a+=(Math.random()-.5)*1.1;x+=Math.cos(a)*.8;y+=Math.sin(a)*.8;q.push([x,y]);}cracks.push(q);}}
 w.className=lose?'lose':'won';
 $('wt').textContent=lose?'💀 Kekalahan':(mode=='ai'?'🏆 Kemenangan!':'🏆 '+pname(pl)+' menang!');
 $('ws').textContent=lose?pname(1)+' menguasai labirin.':pname(pl)+' mencapai garis akhir!';
 setTimeout(()=>{if(g==gid)w.style.display='flex';},900*K);
}
function start(){
 gid++;endT=0;loser=-1;S=newState();over=false;busy=false;um='m';hov=null;hc=null;an=[null,null];wa={};pts=[];rings=[];note='';
 $('menu').style.display='none';$('game').style.display='block';$('win').style.display='none';
 mkHud();hud();scrollTo(0,0);
}
function pos(e){
 const b=cv.getBoundingClientRect(),u=cv.width/(9+8*G);
 return[(e.clientX-b.left)*cv.width/b.width/u,(e.clientY-b.top)*cv.height/b.height/u];
}
function slot(e){
 const [x,y]=pos(e),cl=v=>Math.max(0,Math.min(7,v));
 return{t:um,r:cl(Math.round((y-1-G/2)/st)),c:cl(Math.round((x-1-G/2)/st))};
}
cv.addEventListener('mousemove',e=>{
 if(um!='m'){hov=slot(e);return;}
 const [x,y]=pos(e),c=Math.floor(x/st),r=Math.floor(y/st);
 hc=(!busy&&!over&&x-c*st<=1&&y-r*st<=1&&pmoves(S,S.t).some(p=>p[0]==r&&p[1]==c))?[r,c]:null;
 cv.style.cursor=hc?'pointer':'default';
});
cv.addEventListener('mouseleave',()=>{hov=null;hc=null;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(um!='m'){um=um=='h'?'v':'h';hov=slot(e);hud();}});
cv.addEventListener('click',e=>{
 if(over||busy)return;
 if(um=='m'){
  const [x,y]=pos(e),c=Math.floor(x/st),r=Math.floor(y/st);
  if(x-c*st>1||y-r*st>1)return;
  if(pmoves(S,S.t).some(p=>p[0]==r&&p[1]==c))act({t:'m',r,c});
  else say('Pilih petak bertitik untuk bergerak.',1);
 }else{
  const w=slot(e);
  if(S.w[S.t]<1){say('Dindingmu sudah habis.',1);return;}
  if(!wallTest(S,w.t,w.r,w.c)){say('Dinding tidak sah: bertabrakan atau menutup semua jalan.',1);hov=w;return;}
  act(w);
 }
});

/* ---------- menu ---------- */
const save=()=>{try{localStorage.setItem('quoridor',JSON.stringify({th:theme,m:mode,lv}))}catch(e){}};
try{const q=JSON.parse(localStorage.getItem('quoridor')||'{}');if(TH[q.th])theme=q.th;if(q.m=='ai'||q.m=='pp')mode=q.m;if(q.lv>0&&q.lv<6)lv=q.lv|0;}catch(e){}
function buildMenu(){
 $('lvbox').style.display=mode=='ai'?'block':'none';
 $('modes').innerHTML='';
 [['ai','Lawan AI','Uji strategimu melawan komputer'],['pp','2 pemain','Gantian di satu layar']].forEach(([k,t,s])=>{
  const b=document.createElement('button');b.innerHTML=`<b>${t}</b><small>${s}</small>`;b.className=mode==k?'on':'';b.setAttribute('aria-pressed',mode==k);
  b.onclick=()=>{mode=k;save();buildMenu();};$('modes').append(b);
 });
 $('lvs').innerHTML='';
 LV.forEach((l,i)=>{
  const b=document.createElement('button');b.className=lv==i+1?'on':'';b.textContent=l[1];b.setAttribute('aria-pressed',lv==i+1);
  b.onclick=()=>{lv=i+1;save();buildMenu();};$('lvs').append(b);
 });
 $('lvd').innerHTML=`<b>${LV[lv-1][0]}.</b> ${LV[lv-1][2]}`;
}
function buildThemes(){
 const box=$('themes');box.innerHTML='';
 TH.forEach((t,i)=>{
  const b=document.createElement('button');b.className='tc';
  b.style.setProperty('--t1',t.bg);b.style.setProperty('--ta',t.acc);
  b.innerHTML=`<span class="ic2">${t.i}</span><span>${t.n}</span><span class="dots"><u style="background:${t.p[0]}"></u><u style="background:${t.p[1]}"></u><u style="background:${t.wall}"></u></span>`;
  b.onclick=()=>{theme=i;save();applyTheme();};box.append(b);
 });
}
$('go').onclick=start;$('again').onclick=start;
const toMenu=()=>{gid++;busy=false;$('game').style.display='none';$('menu').style.display='block';scrollTo(0,0);};
$('tomenu').onclick=toMenu;$('bx').onclick=toMenu;
$('bm').onclick=()=>{um='m';say('');hud();};$('bh').onclick=()=>{um='h';say('');hud();};$('bv').onclick=()=>{um='v';say('');hud();};
buildThemes();buildMenu();applyTheme();
(function loop(){
 if($('game').style.display=='block'){if(S)draw();}else drawPreview();
 requestAnimationFrame(loop);
})();
</script></body></html>
